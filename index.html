<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Handschrift</title>
<style>
  :root { --ink: #E67300; --fg: #1c1c1c; --muted: #6b6b6b; --bg: #fbfaf7; --line: #ddd; --btn: #1c1c1c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 17px/1.45 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 28px; margin: 8px 0 2px; }
  h1 span { color: var(--ink); }
  .muted { color: var(--muted); font-size: 15px; }
  section { margin-top: 20px; }
  label { display: block; font-size: 15px; color: var(--muted); margin: 10px 0 4px; }
  input[type=password], input[type=number], select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--fg); }
  textarea { min-height: 170px; resize: vertical; }
  input[type=number] { width: 110px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1 1 160px; }
  .row > .narrow { flex: 0 0 auto; }
  button, a.button { font: inherit; font-weight: 600; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--btn); color: #fff; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
  button.secondary, a.button.secondary { background: #fff; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  progress { width: 100%; height: 8px; accent-color: var(--ink); }
  #lines { padding-left: 28px; margin: 8px 0; font-size: 15px; }
  #lines li { margin: 2px 0; }
  #lines .note { color: var(--muted); }
  #preview canvas { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; margin-top: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .error { color: #b00020; }
  footer { margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Hand<span>schrift</span></h1>
  <div id="engine" class="muted">…</div>

  <section id="login">
    <form id="loginForm">
      <input type="text" name="username" autocomplete="username" value="handschrift" style="display:none" tabindex="-1" aria-hidden="true">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" name="password" autocomplete="current-password" required autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="row" style="margin-top: 12px">
        <button id="unlock" type="submit" class="narrow">Entsperren</button>
        <div id="loginStatus" class="muted"></div>
      </div>
      <progress id="dlProgress" max="100" value="0" hidden></progress>
    </form>
  </section>

  <section id="write" hidden>
    <label for="text">Text</label>
    <textarea id="text" placeholder="Was soll in deiner Handschrift geschrieben werden? Eine Leerzeile lässt eine Linie frei."></textarea>
    <div class="row">
      <div><label for="quality">Qualität</label>
        <select id="quality">
          <option value="fast">Schnell (8 Versuche je Zeile)</option>
          <option value="good" selected>Gut (64 Versuche je Zeile)</option>
          <option value="best">Beste (64 Versuche, wortweise)</option>
        </select></div>
      <div class="narrow"><label for="seed">Seed</label><input id="seed" type="number" value="0" min="0" step="1"></div>
      <button id="go" class="narrow">Schreiben</button>
      <button id="stop" class="narrow secondary" hidden>Abbrechen</button>
    </div>
    <div id="status" class="muted" style="margin-top: 10px"></div>
    <ol id="lines"></ol>
    <div id="result" hidden>
      <div class="row">
        <a id="download" class="button" download="handschrift.goodnotes" href="#">Herunterladen (.goodnotes)</a>
        <button id="share" class="secondary" hidden>Teilen / in GoodNotes öffnen</button>
      </div>
      <div id="preview"></div>
    </div>
  </section>

  <footer class="muted">Während des Schreibens den Tab offen lassen. Die .goodnotes-Datei landet in „Downloads“ in der Dateien-App; dort antippen und mit GoodNotes öffnen.</footer>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
